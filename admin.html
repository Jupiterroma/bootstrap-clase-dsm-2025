<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración Espacial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        body {
            background-image: url('https://source.unsplash.com/1600x900/?space,stars');
            background-size: cover;
            color: white;
        }
        .sidebar {
            background: rgba(0, 0, 0, 0.8);
        }
        .modal-content, .breadcrumb, .table {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        .progress-bar {
            background-color: #ffcc00;
        }
    </style>
</head>
<body>
    <div class="d-flex">
        <!-- Columna izquierda (Sidebar) -->
        <div class="sidebar text-white p-3 min-vh-100" style="width: 250px;">
            <h4 class="text-center">🚀 Admin Espacial</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="#" class="nav-link text-white">🌌 Dashboard</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">👨‍🚀 Astronautas</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">📡 Reportes</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">⚙️ Configuración</a></li>
            </ul>
        </div>
        
        <!-- Contenido principal -->
        <div class="p-4 w-100">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="#">Inicio</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Panel de Administración</li>
                </ol>
            </nav>
            
            <!-- Tabla -->
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Rol</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Neil Armstrong</td>
                        <td>Comandante</td>
                        <td>
                            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">Editar</button>
                        </td>
                    </tr>
                </tbody>
            </table>
            
            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Editar Usuario</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <p>Formulario de edición aquí.</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Barra de progreso -->
            <div class="my-3">
                <label>Progreso de la misión:</label>
                <div class="progress">
                    <div class="progress-bar" style="width: 70%;">70%</div>
                </div>
            </div>
            
            <!-- Botón con popover y tooltip -->
            <button type="button" class="btn btn-secondary" data-bs-toggle="tooltip" title="Información del sistema solar">🌍 Hover me</button>
            <button type="button" class="btn btn-info" data-bs-toggle="popover" title="Estación Espacial" data-bs-content="Aquí se muestra la información sobre la ISS">🛰 Popover</button>
        </div>
    </div>
    
    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl);
        });
        
        var popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'));
        var popoverList = popoverTriggerList.map(function (popoverTriggerEl) {
            return new bootstrap.Popover(popoverTriggerEl);
        });
    </script>
</body>
</html>
